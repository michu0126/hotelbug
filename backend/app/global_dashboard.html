<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotelbug · 全球酒店监控</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Microsoft Yahei",sans-serif;color:#18282e;background:#f2f6f5}
body{max-width:1120px;margin:48px auto;padding:0 24px}small,.hint{color:#667a80}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}p{line-height:1.7}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.live{background:#e1f3eb;color:#16694a;border-radius:20px;padding:9px 16px;font-size:14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0}.metric,.panel{background:white;border:1px solid #dae5e2;border-radius:16px;padding:24px}.metric span{display:block;color:#60767b;font-size:14px}.metric strong{display:block;font-size:34px;margin-top:10px}.panel{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{color:#61767b;font-size:13px;font-weight:500}td,th{padding:18px 12px;border-bottom:1px solid #e7eeec}td:first-child{font-weight:600}td:last-child{white-space:normal;min-width:150px;font-size:13px;color:#6a7d82}.tag{padding:5px 10px;background:#edf3f1;border-radius:12px;font-size:12px}.tag.good{background:#def2e6;color:#176d49}.tag.warn{background:#fff1df;color:#9a5c10}footer{margin-top:22px;font-size:13px;color:#64797f;line-height:1.8}.error{color:#ad4232}@media(max-width:650px){body{margin:24px auto;padding:0 14px}.metrics{gap:8px}.metric{padding:16px 12px}.metric strong{font-size:27px}.top{align-items:flex-start}h1{font-size:24px}.panel{padding:12px}td,th{padding:16px 10px}}
</style>
<div class="top"><div><small>HOTELBUG / OFFICIAL HOTEL MONITOR</small><h1>全球酒店价格监控</h1><p class="hint">六大集团官网 · 未来一年 · 自动查价与降价复核</p></div><span class="live" id="runtime">正在连接</span></div>
<div class="metrics"><div class="metric"><span>参与监控酒店</span><strong id="hotels">—</strong></div><div class="metric"><span>已查询酒店日期</span><strong id="stays">—</strong></div><div class="metric"><span>真实报价记录</span><strong id="prices">—</strong></div></div>
<div class="panel"><table><thead><tr><th>集团</th><th>酒店</th><th>查询日期</th><th>报价</th><th>状态</th><th>最近问题</th></tr></thead><tbody id="brands"></tbody></table></div>
<footer><div id="updated">等待首次读取</div>酒店目录会持续扩展，已收录酒店按日期轮流查询。查询数量包含官网明确无房、尚未开放的日期。<br>入住条件：1房、2成人、1晚。当前本机未配置手机通知，已确认的降价保留在数据库中。</footer>
<script>
const names={marriott:'万豪 Marriott',ihg:'IHG 洲际',hilton:'希尔顿 Hilton',hyatt:'凯悦 Hyatt',gha:'GHA DISCOVERY',accor:'雅高 Accor'};
const issues={RATE_LIMITED:'官网限制请求，等待手动恢复',BLOCKED_BY_ANTIBOT:'官网拒绝访问，等待手动恢复',TIMEOUT:'页面加载超时，已安排重试',NETWORK_ERROR:'网络连接失败，已安排重试',PARSER_ERROR:'页面采集需要检查',NOT_IMPLEMENTED:'当前酒店流程待适配',PROVIDER_CHANGED:'官网页面结构需要适配'};
const number=x=>Number(x||0).toLocaleString('zh-CN');
async function refresh(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();const entries=Object.entries(data.brands||{});if(!data.initialized)throw Error();let hotels=0,stays=0,prices=0;const table=document.getElementById('brands');table.replaceChildren();for(const [brand,value]of entries){hotels+=value.hotels;stays+=value.stay_observations;prices+=value.price_records;const tr=document.createElement('tr');const error=value.manual_pause?.reason||value.provider?.last_error;const status=value.manual_pause?'已暂停':value.price_records>0?'已取得房价':value.jobs?.RUNNING?'正在查询':'等待查询';for(const text of[names[brand]||brand,number(value.hotels),number(value.stay_observations),number(value.price_records)]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td');const tag=document.createElement('span');tag.className='tag '+(value.manual_pause?'warn':value.price_records>0?'good':'');tag.textContent=status;td.append(tag);tr.append(td);const detail=document.createElement('td');detail.textContent=issues[error]||error||'—';tr.append(detail);table.append(tr)}document.getElementById('hotels').textContent=number(hotels);document.getElementById('stays').textContent=number(stays);document.getElementById('prices').textContent=number(prices);document.getElementById('runtime').textContent=data.runtime?.running?'自动采集中':'采集已停止';document.getElementById('updated').textContent='状态更新：'+new Date().toLocaleString('zh-CN')}catch{document.getElementById('runtime').textContent='暂时无法连接';document.getElementById('updated').textContent='正在重新连接，请保持采集程序运行'}}refresh();setInterval(refresh,10000);
</script></html>
