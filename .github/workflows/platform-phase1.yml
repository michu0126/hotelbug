name: Verify and publish Hotel Bug default stack
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/platform-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotelbug_test
          POSTGRES_USER: hotelbug
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hotelbug -d hotelbug_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint and offline fixture tests
        working-directory: backend
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic
          pytest -q
      - name: PostgreSQL migration round trip
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://hotelbug:test-only@localhost:5432/hotelbug_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Real PostgreSQL and Redis integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://hotelbug:test-only@localhost:5432/hotelbug_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest -q
      - name: Build and boot all six services
        run: |
          docker compose -f docker-compose.yml -f docker/compose.build.yml config --quiet
          docker compose -f docker-compose.yml -f docker/compose.build.yml build --pull
          docker compose -f docker-compose.yml -f docker/compose.build.yml up -d --no-build --pull never --wait --wait-timeout 180
          curl --fail http://localhost:8098/api/health/ready
          curl --fail http://localhost:8098/api/dashboard
          curl --fail http://localhost:8098/api/providers
      - name: Compose diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100
          docker compose down
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: api
            primary_tag: api-latest
          - target: frontend
            primary_tag: latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            michu0126/hotelbug:${{ matrix.primary_tag }}
            michu0126/hotelbug:phase2-preview-${{ matrix.target }}
            michu0126/hotelbug:phase2-preview-${{ matrix.target }}-${{ github.sha }}
            ghcr.io/michu0126/hotelbug:${{ matrix.primary_tag }}
            ghcr.io/michu0126/hotelbug:phase2-preview-${{ matrix.target }}
