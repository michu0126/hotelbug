[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelbug-collector"
version = "0.1.0"
description = "Official-page hotel sampling and worldwide six-group monitoring"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50,<2", "PyYAML>=6,<7", "httpx>=0.27,<1", "websockets>=15,<16", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
hotelbug-collector = "main:cli"
hotelbug-capture = "scripts.capture_har:cli"
hotelbug-passive = "passive_capture:main"
hotelbug-passive-monitor = "monitor_passive:cli"
hotelbug-auto = "global_monitor:cli"
hotelbug-marriott-auto = "automatic_monitor:cli"

[tool.setuptools]
py-modules = ["models", "storage", "detector", "notifier", "main", "configuration", "runtime", "passive_capture", "passive_config", "passive_storage", "passive_monitor", "monitor_passive", "automatic_config", "automatic_queue", "automatic_monitor", "global_monitor"]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
